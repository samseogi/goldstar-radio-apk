plugins {
    id 'com.android.application'
}

android {
    namespace 'com.samseogi.goldstarradio'
    compileSdk 34

    defaultConfig {
        applicationId "com.samseogi.goldstarradio"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
